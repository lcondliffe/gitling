name: Release

on:
  push:
    tags: ["v*"]
  # Called by release-please, whose GITHUB_TOKEN-pushed tag cannot trigger the
  # push event above.
  workflow_call:
    inputs:
      tag:
        description: tag to build and publish, e.g. v1.2.3
        required: true
        type: string

permissions:
  contents: write

env:
  HOMEBREW_TAP_REPO: lcondliffe/homebrew-tap

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          bin=gitling
          [ "$GOOS" = windows ] && bin=gitling.exe
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "$bin" ./cmd/gitling
          name="gitling_${VERSION}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = windows ]; then
            zip "${name}.zip" "$bin" README.md LICENSE
          else
            tar -czf "${name}.tar.gz" "$bin" README.md LICENSE
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: gitling_*.*
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: checksums
        working-directory: dist
        run: sha256sum gitling_* | tee checksums.txt

      - name: release notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          prev=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            range="${prev}..${TAG}"
            echo "## Changes since ${prev}" > notes.md
          else
            range="${TAG}"
            echo "## Initial release" > notes.md
          fi
          echo >> notes.md
          git log --no-merges --pretty='- %s (%h)' "$range" >> notes.md
          echo >> notes.md
          echo "**Full changelog**: https://github.com/${REPO}/commits/${TAG}" >> notes.md

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            # Already published — by a previous run, or by release-please, which
            # writes the changelog as the body. Attach assets, leave notes be.
            echo "Release ${TAG} already exists; uploading assets"
            gh release upload "${TAG}" \
              --clobber \
              dist/gitling_* dist/checksums.txt
          else
            gh release create "${TAG}" \
              --title "gitling ${TAG}" \
              --notes-file notes.md \
              dist/gitling_* dist/checksums.txt
          fi

      - name: update Homebrew tap formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          SOURCE_REPO: ${{ github.repository }}
          TAP_REPO: ${{ env.HOMEBREW_TAP_REPO }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; skipping Homebrew tap update" >&2
            exit 0
          fi

          gh auth setup-git

          version="${TAG#v}"
          checksums="${GITHUB_WORKSPACE}/dist/checksums.txt"
          tap_dir="$(mktemp -d)"
          formula="Formula/gitling.rb"

          checksum_for() {
            asset="$1"
            awk -v asset="$asset" '$2 == asset { print $1 }' "$checksums"
          }

          darwin_amd64="$(checksum_for "gitling_${TAG}_darwin_amd64.tar.gz")"
          darwin_arm64="$(checksum_for "gitling_${TAG}_darwin_arm64.tar.gz")"
          linux_amd64="$(checksum_for "gitling_${TAG}_linux_amd64.tar.gz")"
          linux_arm64="$(checksum_for "gitling_${TAG}_linux_arm64.tar.gz")"

          for value in "$darwin_amd64" "$darwin_arm64" "$linux_amd64" "$linux_arm64"; do
            if [ -z "$value" ]; then
              echo "Missing expected checksum in ${checksums}" >&2
              exit 1
            fi
          done

          gh repo clone "$TAP_REPO" "$tap_dir"
          cd "$tap_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="gitling-${TAG}"
          existing_pr="$(gh pr list --head "$branch" --state open --json url --jq '.[0].url // ""')"
          if git fetch origin "$branch"; then
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout -b "$branch"
          fi

          mkdir -p Formula
          cat > "$formula" <<EOF
          class Gitling < Formula
            desc "At-a-glance git repository dashboard for the terminal"
            homepage "https://github.com/${SOURCE_REPO}"
            version "${version}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/${SOURCE_REPO}/releases/download/${TAG}/gitling_${TAG}_darwin_arm64.tar.gz"
                sha256 "${darwin_arm64}"
              else
                url "https://github.com/${SOURCE_REPO}/releases/download/${TAG}/gitling_${TAG}_darwin_amd64.tar.gz"
                sha256 "${darwin_amd64}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/${SOURCE_REPO}/releases/download/${TAG}/gitling_${TAG}_linux_arm64.tar.gz"
                sha256 "${linux_arm64}"
              else
                url "https://github.com/${SOURCE_REPO}/releases/download/${TAG}/gitling_${TAG}_linux_amd64.tar.gz"
                sha256 "${linux_amd64}"
              end
            end

            def install
              bin.install "gitling"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/gitling --version")
            end
          end
          EOF
          sed -i 's/^          //' "$formula"

          git add "$formula"
          if git diff --cached --quiet; then
            if [ -n "$existing_pr" ]; then
              echo "Homebrew formula PR already exists for ${TAG}: ${existing_pr}"
            else
              echo "Homebrew formula already up to date for ${TAG}"
            fi
            exit 0
          fi

          git commit -m "gitling ${TAG}"
          git push origin "$branch"

          if [ -n "$existing_pr" ]; then
            echo "Updated existing Homebrew formula PR: ${existing_pr}"
          else
            printf 'Update gitling formula for %s.\n\nSource release: https://github.com/%s/releases/tag/%s\n' \
              "$TAG" "$SOURCE_REPO" "$TAG" > pr-body.md
            gh pr create \
              --title "gitling ${TAG}" \
              --body-file pr-body.md \
              --head "$branch" \
              --base main
          fi
