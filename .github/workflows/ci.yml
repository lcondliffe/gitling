name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Release PRs are opened with GITHUB_TOKEN, which fires no pull_request event,
  # so their required checks would never report. release-please.yml asks for this
  # run by hand — workflow_dispatch is the one trigger GITHUB_TOKEN can fire.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Preview binaries must be the PR head, not GitHub's synthetic merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: build
        run: go build ./cmd/gitling

      - name: Upload PR preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gitling-pr-${{ github.event.pull_request.number }}-${{ runner.os }}-${{ runner.arch }}-${{ github.event.pull_request.head.sha }}
          path: |
            gitling
            gitling.exe
          if-no-files-found: error
          retention-days: 14
          archive: true
