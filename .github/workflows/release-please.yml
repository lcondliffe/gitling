name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write # to dispatch CI onto the release PR branch

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The release PR is opened with GITHUB_TOKEN, and GitHub fires no
      # pull_request event for those — so CI never reported on it and main's
      # required checks could only ever be bypassed by an admin. Dispatching the
      # run explicitly puts the same three build contexts on the branch head,
      # which is what branch protection actually looks at.
      # Keyed off the open release PR rather than this run's outputs: the action
      # only reports a pr when it changed one, but the branch head also moves
      # when the PR is rebased or updated, and every one of those heads needs its
      # own checks. No open release PR is the no-op case.
      #
      # Best effort on purpose: the dispatch can only work on a branch whose own
      # copy of ci.yml already has the workflow_dispatch trigger, since that is
      # read from the dispatched ref. A release branch cut before that landed
      # can't be dispatched at all, and that is a merge to unblock by hand, not
      # a broken release pipeline.
      - name: run CI on the release PR branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("release-please--"))][0].headRefName // ""')
          if [ -z "$branch" ]; then
            echo "no open release PR; nothing to check"
            exit 0
          fi
          echo "dispatching CI at $branch"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

  # release-please pushes the tag with GITHUB_TOKEN, and GitHub does not fire
  # workflows for those, so release.yml is called directly rather than left to
  # its own tag trigger.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
    permissions:
      contents: write
